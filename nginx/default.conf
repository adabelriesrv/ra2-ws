# Abre la declaracion 
server {
# Configura Nginx para escuchar por el puerto 80 el trafico http
 listen 80;
# Sirve para responder cualquier dominio o ip que llegue al servidor aunque no este definida
 server_name _;
# Es la ruta del directorio raiz en el sitema de archivos donde se ubican los archivos wev 
 root /var/www/html;
# Define el archivo index.php como archivo predeterminado al solicitar un directorio 
 index index.php;
# Aumenta el tamaño maximo para la subida de archivos en la peticiones http a 64MB
 client_max_body_size 64M;
# Aplica todas las reglas a todas las solicitudes que entran que no coincidan con los bloques especificos
 location / {
# El archivo solicitado
 try_files $uri $uri/ /index.php?$args;
 }
# Usa una expresion regular pars capturar cualquier peticion aacabada en .php
 location ~ \.php$ {
# Carga las variables de entorno necesarias para la comunicacio n del protocolo FastCGI
 include fastcgi_params;
# Redirige l ejecuccuin del archivo php al contenedor llamado wodpress escuchando el FastCGI
 fastcgi_pass wordpress:9000;
# Pasa a PHP-FPM la ruta fisica concatenada para que sepa que archivo ejecutar en su propio sistema 
 fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
 }
}
